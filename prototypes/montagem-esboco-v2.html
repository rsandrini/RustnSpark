<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estaleiro — Montagem v0.2</title>
<style>
  :root{
    box-sizing:border-box;
    --bg:#12161a; --panel:#1a2026; --panel-2:#222a31; --grid:#232c33;
    --steel:#3a4650; --steel-lt:#5a6b78; --ink:#c9d4dc; --ink-dim:#7e8c98;
    --amber:#e0a13c; --amber-dim:#8a6a2c; --ok:#5fb08a; --bad:#c8543f;
  }
  *{box-sizing:inherit}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:ui-monospace,'Cascadia Code',Menlo,Consolas,monospace;
    font-size:14px;line-height:1.5;padding-top:env(safe-area-inset-top,0);
    display:flex;flex-direction:column;height:100%}
  header{padding:12px 20px;border-bottom:1px solid var(--steel);
    display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
  header h1{font-family:Georgia,serif;font-size:20px;font-weight:600;margin:0;letter-spacing:.3px}
  header .sub{color:var(--ink-dim);font-size:12px}
  header .sub b{color:var(--amber);font-weight:600}
  .wrap{display:flex;flex:1;min-height:0;flex-wrap:wrap}
  .tray{width:230px;background:var(--panel);border-right:1px solid var(--steel);padding:14px;overflow-y:auto}
  .tray h2,.sheet h2{font-size:11px;letter-spacing:1px;color:var(--amber);font-weight:600;
    margin:0 0 10px;text-transform:uppercase;border-bottom:1px solid var(--amber-dim);padding-bottom:6px}
  .part-btn{display:block;width:100%;background:var(--panel-2);border:1px solid var(--steel);
    color:var(--ink);padding:8px 10px;margin-bottom:7px;cursor:grab;text-align:left;
    font-family:inherit;font-size:12px;border-radius:2px;transition:border-color .12s,background .12s}
  .part-btn:hover{border-color:var(--steel-lt);background:#28323a}
  .part-btn:active{cursor:grabbing}
  .part-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .part-head .dot{width:9px;height:9px;border-radius:1px;flex:none}
  .part-head .nm{flex:1}
  .part-head .sz{color:var(--ink-dim);font-size:10px}
  .part-body{display:flex;gap:8px;align-items:center}
  /* mini preview do formato */
  .shape{display:grid;gap:1px;flex:none}
  .shape i{width:7px;height:7px;background:var(--steel-lt);display:block}
  .part-stats{font-size:10px;color:var(--ink-dim);line-height:1.35}
  .part-stats b{color:var(--ink);font-weight:600}

  .yard{flex:1;min-width:280px;position:relative;overflow:hidden;
    background:linear-gradient(var(--grid) 1px,transparent 1px) 0 0/28px 28px,
      linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/28px 28px,
      radial-gradient(circle at 50% 40%,#171d22,#0e1215)}
  .yard .hint{position:absolute;top:12px;left:50%;transform:translateX(-50%);
    color:var(--ink-dim);font-size:11px;pointer-events:none;text-align:center;width:90%}
  .block{position:absolute;border:1px solid var(--steel-lt);background:var(--panel-2);
    display:flex;align-items:center;justify-content:center;cursor:grab;user-select:none;
    border-radius:2px;overflow:hidden;transition:box-shadow .1s}
  .block:active{cursor:grabbing;z-index:50}
  .block .bl-name{font-size:10px;color:var(--ink);text-align:center;padding:2px;pointer-events:none}
  .block .bl-bar{height:3px;width:100%;position:absolute;bottom:0;left:0;pointer-events:none}
  .block.floating{border-color:var(--bad);border-style:dashed}
  .block.bridge{border-color:var(--amber);border-width:2px}
  .block.selected{box-shadow:0 0 0 2px var(--amber),0 0 12px rgba(224,161,60,.4)}
  .block .rm{position:absolute;top:1px;right:2px;font-size:11px;color:var(--ink-dim);
    cursor:pointer;line-height:1;padding:2px;display:none}
  .block:hover .rm{display:block}

  .sheet{width:260px;background:var(--panel);border-left:1px solid var(--steel);padding:14px;overflow-y:auto}
  .stat{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dotted var(--steel);font-size:13px}
  .stat .k{color:var(--ink-dim)} .stat .v{color:var(--ink);font-variant-numeric:tabular-nums}
  .bar-row{margin:10px 0}
  .bar-row .lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-dim);margin-bottom:3px}
  .bar{height:8px;background:#0d1115;border:1px solid var(--steel);border-radius:2px;overflow:hidden}
  .bar>i{display:block;height:100%}
  .verdict{margin-top:12px;padding:10px;border-radius:2px;font-size:12px;line-height:1.45}
  .verdict.ok{background:#16241d;border:1px solid var(--ok);color:#a9e0c6}
  .verdict.bad{background:#241614;border:1px solid var(--bad);color:#e5a99c}
  .verdict .cls{font-family:Georgia,serif;font-size:16px;display:block;margin-bottom:4px}
  .verdict ul{margin:6px 0 0;padding-left:16px} .verdict li{margin:2px 0}
  /* painel de peça selecionada */
  .detail{margin-top:14px;padding:10px;background:var(--panel-2);border:1px solid var(--steel);border-radius:2px;font-size:12px;display:none}
  .detail.show{display:block}
  .detail h3{margin:0 0 6px;font-size:13px;font-family:Georgia,serif;color:var(--amber)}
  .detail .d-row{display:flex;justify-content:space-between;padding:2px 0;color:var(--ink-dim)}
  .detail .d-row b{color:var(--ink);font-weight:600}
  .detail .d-act{margin-top:8px;font-size:11px;color:var(--ink-dim)}
  @media (max-width:820px){
    .tray{width:100%;border-right:none;border-bottom:1px solid var(--steel);max-height:170px}
    .sheet{width:100%;border-left:none;border-top:1px solid var(--steel)}
    .yard{min-height:340px}
  }
</style>
</head>
<body>
<header>
  <h1>Estaleiro</h1>
  <span class="sub">arraste peças · encoste para conectar · <b>R</b> ou clique-direito para girar · clique para inspecionar</span>
</header>
<div class="wrap">
  <aside class="tray" id="tray"><h2>Peças</h2></aside>
  <main class="yard" id="yard">
    <div class="hint" id="hint">Comece pela Ponte. Cada peça precisa encostar em outra.<br>Gire a peça arrastada com <b>R</b>.</div>
  </main>
  <aside class="sheet">
    <h2>Ficha da nave</h2>
    <div id="stats"></div>
    <div id="bars"></div>
    <div class="verdict" id="verdict"></div>
    <div class="detail" id="detail"></div>
  </aside>
</div>

<script>
const CELL=28;
const CATALOG={
  bridge:{name:'Ponte de comando',w:2,h:2,color:'#e0a13c',give:{HP:30},energia:-1,mass:4,bridge:true,
    desc:'O núcleo. Traz transponder, O₂ de emergência e bateria mínima. Define o casco.'},
  eng_s:{name:'Motor químico P',w:1,h:2,color:'#6f9ad6',pot:25,mass:3,energia:2,fuelUse:0.7,
    desc:'Pouca potência, econômico. Gera energia e queima combustível líquido.'},
  eng_l:{name:'Motor químico G',w:2,h:2,color:'#4f7fc4',pot:70,mass:14,energia:7,fuelUse:2.5,
    desc:'Muita potência, sedento. Gera bastante energia. Pesado.'},
  ion:{name:'Motor iônico',w:1,h:2,color:'#79b4e0',pot:22,mass:8,energia:-8,
    desc:'Eficiente, sem combustível — mas CONSOME muita energia. Exige reator.'},
  tank:{name:'Tanque',w:1,h:2,color:'#c98b4f',fuel:1000,mass:5,
    desc:'Armazena combustível líquido. Necessário para motores químicos.'},
  batt:{name:'Bateria',w:1,h:1,color:'#8a6fd6',output:80,mass:5,energia:0,
    desc:'Armazena carga e cobre picos de combate (laser, escudo).'},
  nuclear:{name:'Reator nuclear',w:2,h:1,color:'#a9d65f',energia:18,mass:14,
    desc:'Geração alta e constante. Torna iônicos viáveis. Caro.'},
  solar:{name:'Painel solar',w:2,h:1,color:'#d6cf5f',energia:3,mass:2,
    desc:'Energia grátis mas fraca. Complemento, não sustenta iônicos sozinho.'},
  gun:{name:'Canhão balístico',w:1,h:1,color:'#c8543f',PDF:3,mass:3,cat:'arma',
    desc:'Barato. Usa munição estocada. Não gasta energia.'},
  laser:{name:'Laser',w:1,h:1,color:'#c85fa0',PDF:4,mass:4,energia:-5,cat:'arma',
    desc:'Munição infinita, mas drena energia no combate.'},
  missile:{name:'Lançador míssil',w:1,h:2,color:'#d67a5f',PDF:8,mass:6,cat:'arma',
    desc:'Alto dano. Mísseis ocupam espaço de estoque.'},
  armor:{name:'Placa militar',w:2,h:1,color:'#7e8c98',BLI:5,HP:40,mass:10,cat:'defesa',
    desc:'Blindagem pesada. Reduz dano recebido.'},
  shield:{name:'Gerador escudo',w:1,h:1,color:'#5f9fc8',ESC:6,mass:4,energia:-6,cat:'defesa',
    desc:'Absorve dano antes do casco. Drena energia ligado.'},
  cargo:{name:'Porão de carga',w:2,h:1,color:'#5fb08a',CRG:5,mass:2,cat:'carga',
    desc:'Espaço de carga genérico.'},
  pax:{name:'Cabine pressur.',w:1,h:1,color:'#5fb0a0',CRG:2,mass:3,energia:-2,cat:'passageiro',
    desc:'Passageiros/prisioneiros. Exige suporte de vida.'},
  radar:{name:'Radar',w:1,h:1,color:'#67c7c0',SEN:4,mass:2,energia:-2,cat:'sensor',
    desc:'Detecta naves antes, melhora iniciativa e fuga.'},
};
const STAT_LABELS={pot:'Potência',mass:'Massa',energia:'Energia',fuel:'Combustível',
  output:'Output bat.',PDF:'Poder fogo',BLI:'Blindagem',ESC:'Escudo',CRG:'Carga',SEN:'Sensores',HP:'Casco'};

const tray=document.getElementById('tray'), yard=document.getElementById('yard');
let blocks=[], uid=0, selId=null, dragRot=0;

// paleta com preview de formato + stats
for(const [type,p] of Object.entries(CATALOG)){
  const b=document.createElement('button');
  b.className='part-btn'; b.draggable=true;
  // mini shape
  let shape=`<div class="shape" style="grid-template-columns:repeat(${p.w},7px)">`;
  for(let i=0;i<p.w*p.h;i++) shape+=`<i style="background:${p.color}"></i>`;
  shape+='</div>';
  // stats resumidos
  const st=[];
  if(p.pot)st.push(`pot <b>${p.pot}</b>`);
  if(p.PDF)st.push(`fogo <b>${p.PDF}</b>`);
  if(p.BLI)st.push(`bli <b>${p.BLI}</b>`);
  if(p.ESC)st.push(`esc <b>${p.ESC}</b>`);
  if(p.CRG)st.push(`carga <b>${p.CRG}</b>`);
  if(p.SEN)st.push(`sen <b>${p.SEN}</b>`);
  if(p.fuel)st.push(`tanque <b>${p.fuel}</b>`);
  if(p.output)st.push(`out <b>${p.output}</b>`);
  if(p.energia)st.push(`en <b>${p.energia>0?'+':''}${p.energia}</b>`);
  st.push(`massa <b>${p.mass}</b>`);
  b.innerHTML=`<div class="part-head"><span class="dot" style="background:${p.color}"></span>
      <span class="nm">${p.name}</span><span class="sz">${p.w}×${p.h}</span></div>
    <div class="part-body">${shape}<div class="part-stats">${st.join(' · ')}</div></div>`;
  b.addEventListener('dragstart',e=>{e.dataTransfer.setData('type',type);dragRot=0});
  tray.appendChild(b);
}

// dimensoes considerando rotacao (0/2 = normal, 1/3 = trocado)
function dims(type,rot){const p=CATALOG[type];return (rot%2)?{w:p.h,h:p.w}:{w:p.w,h:p.h}}

yard.addEventListener('dragover',e=>e.preventDefault());
yard.addEventListener('drop',e=>{
  e.preventDefault();
  const type=e.dataTransfer.getData('type'); if(!type)return;
  const d=dims(type,dragRot);
  const r=yard.getBoundingClientRect();
  const gx=Math.round((e.clientX-r.left)/CELL)-Math.floor(d.w/2);
  const gy=Math.round((e.clientY-r.top)/CELL)-Math.floor(d.h/2);
  place(type,gx,gy,dragRot);
});
// girar peça durante o arraste (antes de soltar): tecla R muda dragRot
window.addEventListener('keydown',e=>{
  if(e.key==='r'||e.key==='R'){
    if(selId!=null){ rotateBlock(selId); }
    else { dragRot=(dragRot+1)%4; }
  }
  if(e.key==='Delete'&&selId!=null){remove(selId)}
});

function overlaps(gx,gy,w,h,ignore){
  for(const b of blocks){ if(b.id===ignore)continue;
    const d=dims(b.type,b.rot);
    if(gx<b.gx+d.w&&gx+w>b.gx&&gy<b.gy+d.h&&gy+h>b.gy)return true}
  return false;
}
function place(type,gx,gy,rot){
  const d=dims(type,rot); gx=Math.max(0,gx);gy=Math.max(0,gy);
  if(overlaps(gx,gy,d.w,d.h,null))return;
  if(type==='bridge'&&blocks.some(b=>b.type==='bridge'))return;
  const id=++uid, p=CATALOG[type];
  const el=document.createElement('div');
  el.className='block'+(p.bridge?' bridge':'');
  el.innerHTML=`<span class="bl-name">${p.name}</span>
    <span class="bl-bar" style="background:${p.color}"></span><span class="rm">✕</span>`;
  yard.appendChild(el);
  const blk={id,type,gx,gy,rot,el};
  blocks.push(blk); layout(blk);
  el.querySelector('.rm').addEventListener('click',ev=>{ev.stopPropagation();remove(id)});
  el.addEventListener('click',ev=>{if(!ev.target.classList.contains('rm'))select(id)});
  el.addEventListener('contextmenu',ev=>{ev.preventDefault();rotateBlock(id)});
  makeDrag(blk);
  document.getElementById('hint').style.display='none';
  select(id); recompute();
}
function layout(blk){
  const d=dims(blk.type,blk.rot), p=CATALOG[blk.type];
  blk.el.style.width=(d.w*CELL-2)+'px'; blk.el.style.height=(d.h*CELL-2)+'px';
  blk.el.style.left=(blk.gx*CELL)+'px'; blk.el.style.top=(blk.gy*CELL)+'px';
  blk.el.style.background=shade(p.color);
}
function rotateBlock(id){
  const b=blocks.find(x=>x.id===id); if(!b)return;
  const nr=(b.rot+1)%4, d=dims(b.type,nr);
  if(!overlaps(b.gx,b.gy,d.w,d.h,id)){b.rot=nr;layout(b);recompute()}
}
function remove(id){
  const i=blocks.findIndex(b=>b.id===id); if(i<0)return;
  blocks[i].el.remove(); blocks.splice(i,1);
  if(selId===id){selId=null;document.getElementById('detail').classList.remove('show')}
  if(!blocks.length)document.getElementById('hint').style.display='';
  recompute();
}
function select(id){
  selId=id;
  blocks.forEach(b=>b.el.classList.toggle('selected',b.id===id));
  const b=blocks.find(x=>x.id===id), p=CATALOG[b.type];
  const rows=[];
  for(const k of ['pot','PDF','BLI','ESC','CRG','SEN','fuel','output','energia','mass'])
    if(p[k]) rows.push(`<div class="d-row"><span>${STAT_LABELS[k]}</span><b>${k==='energia'&&p[k]>0?'+':''}${p[k]}</b></div>`);
  if(p.give&&p.give.HP) rows.push(`<div class="d-row"><span>Casco</span><b>${p.give.HP}</b></div>`);
  if(p.HP) rows.push(`<div class="d-row"><span>Casco</span><b>${p.HP}</b></div>`);
  if(p.fuelUse) rows.push(`<div class="d-row"><span>Consumo/dist</span><b>${p.fuelUse}</b></div>`);
  const det=document.getElementById('detail');
  det.className='detail show';
  det.innerHTML=`<h3>${p.name}</h3><div style="color:var(--ink-dim);margin-bottom:8px">${p.desc}</div>
    ${rows.join('')}<div class="d-act">R / clique-direito: girar · ✕ ou Delete: remover</div>`;
}
function makeDrag(blk){
  const el=blk.el; let sx,sy,ox,oy,drag=false,moved=false;
  el.addEventListener('pointerdown',e=>{
    if(e.target.classList.contains('rm'))return;
    drag=true;moved=false;el.setPointerCapture(e.pointerId);
    sx=e.clientX;sy=e.clientY;ox=blk.gx;oy=blk.gy;el.style.zIndex=50});
  el.addEventListener('pointermove',e=>{
    if(!drag)return;
    const dgx=Math.round((e.clientX-sx)/CELL),dgy=Math.round((e.clientY-sy)/CELL);
    if(dgx||dgy)moved=true;
    const ngx=Math.max(0,ox+dgx),ngy=Math.max(0,oy+dgy),d=dims(blk.type,blk.rot);
    if(!overlaps(ngx,ngy,d.w,d.h,blk.id)){blk.gx=ngx;blk.gy=ngy;
      el.style.left=(ngx*CELL)+'px';el.style.top=(ngy*CELL)+'px'}});
  el.addEventListener('pointerup',e=>{drag=false;el.style.zIndex='';if(moved)recompute()});
}
function adjacent(a,b){
  const da=dims(a.type,a.rot),db=dims(b.type,b.rot);
  const ax2=a.gx+da.w,ay2=a.gy+da.h,bx2=b.gx+db.w,by2=b.gy+db.h;
  const h=(ax2===b.gx||bx2===a.gx)&&(a.gy<by2&&ay2>b.gy);
  const v=(ay2===b.gy||by2===a.gy)&&(a.gx<bx2&&ax2>b.gx);
  return h||v;
}
function cohesionSet(){
  const bridge=blocks.find(b=>b.type==='bridge'); if(!bridge)return new Set();
  const seen=new Set([bridge.id]),stack=[bridge];
  while(stack.length){const cur=stack.pop();
    for(const b of blocks){if(seen.has(b.id))continue;if(adjacent(cur,b)){seen.add(b.id);stack.push(b)}}}
  return seen;
}
function recompute(){
  const set=cohesionSet(), bridge=blocks.find(b=>b.type==='bridge');
  for(const b of blocks){
    const floating=bridge?!set.has(b.id):true;
    b.el.classList.toggle('floating',floating&&b.type!=='bridge')}
  const f={pot:0,mass:0,fuel:0,PDF:0,BLI:0,ESC:0,CRG:0,SEN:0,HP:0};
  const catUse={arma:0,carga:0,defesa:0,sensor:0,passageiro:0};
  let count=0, genC=0, conC=0;
  const conParts=[]; // pra diagnostico de energia
  for(const b of blocks){
    if(bridge&&!set.has(b.id))continue;
    const p=CATALOG[b.type];count++;
    for(const k of ['pot','mass','fuel','PDF','BLI','ESC','CRG','SEN'])f[k]+=p[k]||0;
    f.HP+=(p.HP||0)+((p.give&&p.give.HP)||0);
    const e=p.energia||0;
    if(e>0)genC+=e; else if(e<0){conC+=-e;conParts.push(`${p.name} (${e})`)}
    if(p.cat)catUse[p.cat]+=dims(b.type,b.rot).w*dims(b.type,b.rot).h;
  }
  const MOB=f.mass?Math.max(0,Math.round(f.pot/f.mass*1.6)):0;
  const optTotal=Object.values(catUse).reduce((a,b)=>a+b,0);
  const prop=c=>optTotal?catUse[c]/optTotal:0;
  let cls='—';
  if(count>1){
    if(prop('arma')>=.35&&prop('carga')<.2)cls='Caça';
    else if(prop('carga')>=.35)cls='Cargueira';
    else if(prop('passageiro')>=.35)cls='Transporte';
    else if(prop('arma')>=.25&&prop('carga')>=.25)cls='Corsária';
    else if(prop('sensor')>=.3)cls='Exploradora';
    else cls='Híbrida';
  }
  const rows=[['Mobilidade',MOB],['Poder de fogo',f.PDF],['Blindagem',f.BLI],['Escudo',f.ESC],
    ['Sensores',f.SEN],['Carga',f.CRG],['Casco (HP)',f.HP],['Massa',f.mass],['Combustível',f.fuel]];
  document.getElementById('stats').innerHTML=rows.map(([k,v])=>
    `<div class="stat"><span class="k">${k}</span><span class="v">${v}</span></div>`).join('');
  document.getElementById('bars').innerHTML=
    `<div class="bar-row"><div class="lbl"><span>Energia consumo/geração</span><span>${conC}/${genC}</span></div>
     <div class="bar"><i style="width:${genC?Math.min(100,conC/genC*100):(conC?100:0)}%;
       background:${conC<=genC?'var(--ok)':'var(--bad)'}"></i></div></div>`;
  // diagnostico especifico
  const problems=[];
  if(!bridge)problems.push('Falta a Ponte de comando (o núcleo).');
  if(count>0&&MOB<1)problems.push('Sem propulsão: adicione motor ou reduza massa (MOB 0).');
  if(conC>genC){
    const deficit=conC-genC;
    problems.push(`Energia: faltam <b>${deficit}</b>. Consumindo: ${conParts.join(', ')||'—'}. Some geração>0? Adicione reator/painel/motor químico, ou remova um consumidor.`);
  }
  const hasChem=blocks.some(b=>(!bridge||set.has(b.id))&&CATALOG[b.type].fuelUse);
  const hasTank=blocks.some(b=>(!bridge||set.has(b.id))&&CATALOG[b.type].fuel);
  if(hasChem&&!hasTank)problems.push('Motor químico sem tanque de combustível.');
  if(bridge&&blocks.some(b=>!set.has(b.id)&&b.type!=='bridge'))
    problems.push('Peças flutuando (borda vermelha): encoste-as na nave.');
  const v=document.getElementById('verdict');
  if(bridge&&!problems.length&&count>1){
    v.className='verdict ok';
    v.innerHTML=`<span class="cls">Classe: ${cls}</span>Nave viável. Pronta para despacho.`;
  }else{
    v.className='verdict bad';
    v.innerHTML=`<span class="cls">Classe: ${cls}</span>${bridge?'Ajustes necessários:':'Comece pela ponte.'}<ul>${problems.map(p=>`<li>${p}</li>`).join('')||'<li>Adicione mais peças.</li>'}</ul>`;
  }
}
function shade(hex){const n=parseInt(hex.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255;
  return `rgb(${Math.round(r*.28+30)},${Math.round(g*.28+34)},${Math.round(b*.28+38)})`}
yard.addEventListener('click',e=>{if(e.target===yard){selId=null;
  blocks.forEach(b=>b.el.classList.remove('selected'));
  document.getElementById('detail').classList.remove('show')}});
recompute();
</script>
