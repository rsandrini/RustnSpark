upstream api_upstream {
  server ${API_UPSTREAM};
}

server {
  listen 80;
  # TLS_LISTEN
  server_name localhost;
  root /usr/share/nginx/html;
  index index.html;

  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; font-src 'self';" always;

  location /v1/ {
    proxy_pass http://api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Never let a browser pin a stale shell: index.html points at a hashed bundle, so it must be
  # revalidated on every load (otherwise a rebuild keeps serving the old asset and the UI "stays
  # broken"). The hashed assets themselves are safe to cache hard.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
